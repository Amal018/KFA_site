plugins = []

[functions]

  [functions."*"]

[build]
publish = "."

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/css/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/js/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/student-gallery/*.svg"

  [headers.values]
  Content-Security-Policy = "script-src 'none'"

[[headers]]
for = "/talented-students/*.svg"

  [headers.values]
  Content-Security-Policy = "script-src 'none'"

[[redirects]]
from = "/blog.php"
to = "/blog/:post.html"
status = 200
force = false

