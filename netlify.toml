plugins = []

[functions]

  [functions."*"]

[build]
publish = "."

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/css/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/js/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

# Clean URLs: old .php addresses permanently redirect to the new ones
[[redirects]]
from = "/student-gallery.php"
to = "/students/:id"
status = 301
force = true
  [redirects.query]
  student = ":id"

[[redirects]]
from = "/blog.php"
to = "/blog/:post"
status = 301
force = true
  [redirects.query]
  post = ":post"

